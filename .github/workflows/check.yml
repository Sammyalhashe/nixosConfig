name: "Flake Check"
on:
  pull_request:
  push:
    branches:
      - unstable
      - master
  workflow_dispatch:
  # update-nixvim.yml runs the same checks against its PR branch.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Read-only deploy key for the private phar-liquidity-bot flake input.
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PHAR_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: list
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  # One job per host keeps each evaluation's memory to a single system.
  eval:
    needs: hosts
    name: eval ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PHAR_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - run: nix eval --raw ".#nixosConfigurations.${HOST}.config.system.build.toplevel.drvPath"
        env:
          HOST: ${{ matrix.host }}

  rest:
    name: format, devShell, home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PHAR_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - run: nix build --no-link .#checks.x86_64-linux.formatting
      - run: nix eval --raw .#devShells.x86_64-linux.default.drvPath
      - run: |
          nix eval --json .#homeConfigurations --apply 'builtins.mapAttrs (_: h: h.activationPackage.drvPath)'
